[task]
name = "dynamo/vault-timeline"
description = "Reconstruct composed host artifact timelines from a wrapping oplog vault with txnlog gaps, reincarnation, and path poison."

[metadata]
category = "Security"
subcategory = "Digital Forensics"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["security_artifact", "generated_output_artifact", "dataset_or_tabular_file"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Reconstruct host artifact timelines from a synthetic multi-source forensic vault with a current object table, a circular oplog, and a short transactional gap log. A multi-module almost-correct engine package is shipped and fit smoke digests hash that fit-smoke-calibrated pipeline only. Held work cases require composing reincarnation identity, wrap-seam and cross-ledger MOVE coalesce, txnlog gap fill, stream non-inheritance, path poison with no revive including SI-only residuals, and a corpus index aggregate on a long-horizon composed case. Relying on the fit-smoke-calibrated engine or treating fit smoke digests as normative work expecteds fails the held composition. DFIR analysts who rebuild host timelines from multiple filesystem-style artifacts do this work when correlating object tables with journals and transaction logs after an incident. All corpus data is synthetic."
solution_explanation = "Build a deterministic reconstruction engine that loads the vault, induces closed rules from the contract for identity, coalesce, time authority, wrap handling, stream binding, and path poison, and does not stop at the shipped fit-smoke-calibrated engine package. Apply those rules to held packs where multiple rules interact on the same timeline, including rename halves that straddle the oplog/txnlog seam and SI-only object-table names that must not revive poisoned paths, then emit per-case outputs plus corpus_index.json. Key insight: treat every object as slot plus generation, coalesce rename pairs after full chronological merge regardless of ledger origin, insert txnlog-only ops into the rotated order even when other txn rows overlap oplog, never inherit streams across gen, poison conflicting paths with no revive on SI-only adoption, include SI-only residuals, and aggregate the corpus index."
verification_explanation = "The agent writes graded JSON under /app/output for each work case plus corpus_index.json. The verifier seals expecteds at verify time from /tests/inputs using a reference reconstruction under /tests, then byte-compares agent timeline.json, ownership.json, and corpus_index.json (2-space indent, ensure_ascii false, trailing newline, documented key order). Fit smoke digests are not used as graded expecteds. No numeric tolerance. Residue seals confirm wrong siblings diverge on composed held cases."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 3600.0

