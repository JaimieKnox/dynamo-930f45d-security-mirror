[task]
name = "dynamo/vault-timeline"
description = "Reconstruct composed host artifact timelines from a wrapping oplog vault with txnlog gaps, reincarnation, and path poison."

[metadata]
category = "Security"
subcategory = "Digital Forensics"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["security_artifact", "generated_output_artifact", "dataset_or_tabular_file"]
expert_time_estimate_hours = 1.0
difficulty_explanation = "Induce closed reconstruction rules from a slim vault contract plus multiple disclosed fit packs that ship normative expected timeline and ownership JSON. Held work cases compose wrap oldest-first chronology, txnlog gap fill, MOVE coalesce after full chronological merge including cross-ledger rename halves with MOVE wall from NEW, stream non-inheritance across gen, path poison with no revive including SI-only residuals, and corpus_index aggregates on long joint timelines. Fit topologies are not isomorphic to work cases. No reconstruction engine package is shipped. DFIR analysts who rebuild host timelines from multiple filesystem-style artifacts do this work when correlating object tables with journals and transaction logs after an incident. All corpus data is synthetic."
solution_explanation = "Build a deterministic reconstruction engine by inducing closed rules from CONTRACT.md together with fit expected documents under /app/data/fit/*/expected/. Apply those rules to every held pack under /app/data/work/, including rename halves that straddle ledger origin or the oplog wrap seam, SI-only object-table names that must not revive poisoned paths, and corpus_index.json aggregates. Key insight: treat every object as slot plus generation, coalesce rename pairs only after full chronological merge regardless of ledger origin, take MOVE wall from the NEW row, insert txnlog-only ops into the rotated oldest-first order, never inherit streams across gen, poison conflicting paths with no revive on SI-only adoption, and aggregate the corpus index."
verification_explanation = "The agent writes graded JSON under /app/output for each work case plus corpus_index.json. The verifier seals expecteds at verify time from /tests/inputs using a reference reconstruction under /tests, then byte-compares agent timeline.json, ownership.json, and corpus_index.json (2-space indent, ensure_ascii false, trailing newline, documented key order). Fit expected documents disclose normative fit outputs for rule induction and are not substituted for held work seals. No numeric tolerance. Residue seals confirm wrong siblings diverge on composed held cases."

