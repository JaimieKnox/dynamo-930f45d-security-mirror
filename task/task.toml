[task]
name = "dynamo/vault-timeline"
description = "Reconstruct composed host artifact timelines from a wrapping oplog vault with txnlog gaps, reincarnation, and path poison."

[metadata]
category = "Security"
subcategory = "Digital Forensics"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["security_artifact", "generated_output_artifact", "dataset_or_tabular_file"]
expert_time_estimate_hours = 1.5
difficulty_explanation = "Reconstruct host artifact timelines from a synthetic multi-source forensic vault with a current object table, a circular oplog, and a short transactional gap log. Multiple disclosed fit packs under /app/data/fit (including a third pack charlie) collectively pin closed rules via normative expected timelines and ownership documents at absolute paths such as /app/data/fit/alpha/expected/timeline.json, /app/data/fit/alpha/expected/ownership.json, and /app/data/fit/<id>/expected/timeline.json, including long-horizon per-event chain hashes and corpus_index chain_tips. Held work cases require composing reincarnation identity, wrap-seam and cross-ledger MOVE coalesce with OLD-wall MOVE time, txnlog gap fill, stream non-inheritance, path poison with no revive including SI-only residuals, orphan RENAME_NEW pinned by charlie, legacy MOVE field mapping pinned by fit expecteds, timeline secondary sort by event_id, cascading chain integrity, and a corpus index aggregate including name_claim_count and chain_tips on a denser long-horizon hotel case. No agent-visible reconstruction engine is shipped. DFIR analysts who rebuild host timelines from multiple filesystem-style artifacts do this work when correlating object tables with journals and transaction logs after an incident. All corpus data is synthetic."
solution_explanation = "Build a deterministic reconstruction engine that loads the vault, induces closed rules from the contract and every fit pack expected illustration (alpha, bravo, and charlie orphan RENAME_NEW) for identity, coalesce, legacy MOVE exporter fields with OLD wall, timeline sort, chain hashes, time authority, wrap handling, stream binding, and path poison. Apply those rules to held packs where multiple rules interact on the same denser hotel timeline, including rename halves that straddle the oplog/txnlog seam and SI-only object-table names that must not revive poisoned paths, then emit per-case outputs plus corpus_index.json with chain_tips. Key insight: treat every object as slot plus generation, coalesce rename pairs after full chronological merge regardless of ledger origin, map coalesced MOVE fields as the absolute fit expected timelines demonstrate, sort by time then event_id, compute cascading chain hashes over that order and surface chain_tips in the corpus index, insert txnlog-only ops into the rotated order even when other txn rows overlap oplog, never inherit streams across gen, poison conflicting paths with no revive on SI-only adoption, include SI-only residuals, keep orphan RENAME_NEW standalone, and aggregate the corpus index including name_claim_count and chain_tips."
verification_explanation = "The agent writes graded JSON under /app/output for each work case plus corpus_index.json. The verifier seals expecteds at verify time from /tests/inputs using a reference reconstruction under /tests, then byte-compares agent timeline.json, ownership.json, and corpus_index.json (2-space indent, ensure_ascii false, trailing newline, documented key order including trailing chain). Fit expected documents disclose normative fit illustrations for rule induction. No numeric tolerance. Residue seals confirm wrong siblings diverge on composed held cases, including wrong_move_uses_new_wall which also breaks subsequent chain hashes."

